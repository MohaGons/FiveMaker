# Empêche la mise en pause du projet Supabase (plan gratuit : pause après ~7 jours d'inactivité).
# Une lecture anonyme ne suffit pas (Supabase l'a jugée insuffisante) : on appelle la fonction keep_alive(),
# qui écrit vraiment en base (voir supabase/schema.sql).
name: Keep-alive Supabase

on:
  schedule:
    - cron: "0 8 * * *" # tous les jours à 8h UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Écriture en base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
